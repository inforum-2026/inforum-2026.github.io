  faq:
    - question: "Qual a duração das apresentações?"
      answer: "Cada artigo terá um tempo de apresentação de 15 minutos, seguido de 5 minutos de discussão. Cada comunicação terá um tempo de apresentação de 10 minutos, seguido de 2 minutos de discussão."
    - question: "Haverá prémios para os melhores artigos do INForum?"
      answer: "Sim. Mantendo a tradição adoptada em todas as anteriores edições do INForum, também este ano serão entregues prémios para os melhores artigos cujo principal autor seja um estudante (licenciatura, mestrado ou doutoramento). Cada sessão terá um galardoado, sendo este indicado pelos respectivos chairs. O prémio para o melhor artigo de cada sessão é um voucher de 100€ na FNAC. Além disso, todos os melhores artigos de cada sessão serão candidatos a melhor artigo geral do INForum. Este ano, o prémio será um computador MacBook Air M5, patrocinado pelo UNINOVA."
    - question: "Poderei levar o meu carro e estacionar no Campus da Caparica?"
      answer: "Sim. Todos os participantes poderão trazer a sua viatura própria para o Campus e terão acesso a estacionamento durante os dois dias do evento."
    - question: "Existe algum mapa do Campus do Caparica?"
      answer: "Encontra-se disponível um <a href='/docs/MAPA_CAMPUS_FCT_NOVA.pdf' target='_blank'>🗺️ Mapa do Campus</a>."
    - question: "Onde me devo dirigir quando chegar ao Campus para o registo no dia 3, quinta-feira?"
      answer: "O registo no INForum 2026 e levantamento das respectivas credenciais de cada participante terá lugar na Sala Ágora, junto ao edifício da Biblioteca da Faculdade. O almoço que se lhe segue será também realizado no mesmo espaço. Existirão sinaléticas espalhadas por todo o Campus para melhor orientar os participantes."
    - question: "Quando e onde se irá realizar o jantar da conferência?"
      answer: "O jantar da conferência realiza-se na noite de 3 de setembro, no restaurante <a href='https://lisboaavista.wixsite.com/my-site'>Lisboa à Vista</a> situado na <a href='https://maps.app.goo.gl/aVjq3TqnjTKxdNhD7'>baía do Seixal</a>."
    - question: "Haverá transporte para o restaurante?"
      answer: "Sim. A organização do INForum 2026 assegurou dois autocarros que levarão os participantes do Campus da Caparica directamente para o local do restaurante. O horário de saída será pelas 19 horas. Está também assegurado o regresso ao Campus, pelas 23 horas."

