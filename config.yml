  # --- About section ---
  about:
    description: >
      MyConf is a venue for researchers and practitioners working on
      programming language theory, formal verification, and software correctness.
      We welcome submissions on type systems, proof assistants, static analysis,
      and verified compilation.
    website: "https://yourconference.org"

